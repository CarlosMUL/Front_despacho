name: CI/CD - Frontend

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login a ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build y Push a ECR
        run: |
          docker build -t front-innovatech .
          docker tag front-innovatech:latest 361510669006.dkr.ecr.us-east-1.amazonaws.com/front-innovatech:latest
          docker push 361510669006.dkr.ecr.us-east-1.amazonaws.com/front-innovatech:latest

      - name: Deploy a ECS
        run: |
          aws ecs update-service --cluster Cluster-innovatech --service svc-frontend --force-new-deployment